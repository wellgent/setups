"$schema" = 'https://starship.rs/config-schema.json'

# Needs a Nerd Font in the terminal for the directory and git icons

# Maximum time (ms) for external commands before timeout
command_timeout = 200

# Use Catppuccin Mocha color palette (defined at bottom of file)
palette = 'catppuccin_mocha'

# Prompt layout — clean minimal style with catppuccin colors
format = """
$time\
$hostname\
$directory \
$git_branch\
$git_status\
$git_state\
$git_metrics\
$status\
$jobs\
$line_break\
$character
"""

# Command duration on the right
right_format = """
$cmd_duration
"""

add_newline = false

# ─────────────────────────────────────────────────────────────────────────────
# MODULES
# ─────────────────────────────────────────────────────────────────────────────

# Input prompt character
[character]
success_symbol = "[❯](bold fg:blue)"
error_symbol = "[❯](bold fg:blue)"
vimcmd_symbol = "[❯](bold fg:blue)"
vimcmd_replace_one_symbol = "[❯](bold fg:blue)"
vimcmd_replace_symbol = "[❯](bold fg:blue)"
vimcmd_visual_symbol = "[❯](bold fg:blue)"

# Current time in HH:MM format
[time]
disabled = false
time_format = "%R"
style = "fg:overlay1"
format = '[$time ]($style)'

# Hostname — only shown during SSH sessions
[hostname]
ssh_only = true
style = "fg:red"
format = '[@$hostname ]($style)'

# Current working directory path
[directory]
home_symbol = " ~"
read_only = "  "
style = "fg:yellow"
format = '[󰉋 $path]($style)'
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

# Replace directory names with icons
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"repos" = "󰲋 "

# Git branch name with icon
[git_branch]
symbol = " "
format = "[[\\[$symbol$branch](rosewater) | ](peach)"

# Git working tree status
[git_status]
format = "$all_status$ahead_behind\\] "
conflicted = "[=${count} ](red)"
ahead = "[⇡${count} ](green)"
behind = "[⇣${count} ](maroon)"
diverged = "[⇕⇡${ahead_count} ⇣${behind_count} ](teal)"
up_to_date = "[󰄸 ](bold green)"
untracked = "[?${count} ](maroon)"
stashed = "[󰏖 ](bold green)"
modified = "[~${count} ](yellow)"
staged = "[+${count} ](green)"
renamed = "[»${count} ](peach)"
deleted = "[-${count} ](bold red)"

# Git state (rebase, merge, etc.)
[git_state]
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"
style = "yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

# Git commit hash (shown during detached HEAD)
[git_commit]
format = "[\\($hash\\)]($style) [\\($tag\\)]($style)"
style = "green"

# Lines added/deleted (only shown when non-zero)
[git_metrics]
disabled = false
added_style = "fg:green"
deleted_style = "fg:red"
only_nonzero_diffs = true
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

# Exit status of last command — only shown on error
[status]
disabled = false
format = '[● $status ](fg:red)'
map_symbol = false
success_symbol = ''

# Background jobs count
[jobs]
symbol = " "
style = "fg:lavender"
format = '[$symbol$number ]($style)'

# How long the last command took to execute
[cmd_duration]
show_milliseconds = true
format = "[󰥔 $duration](bold purple)"
disabled = false
show_notifications = false
min_time_to_notify = 45000

# ─────────────────────────────────────────────────────────────────────────────
# COLOR PALETTE
# ─────────────────────────────────────────────────────────────────────────────

# Catppuccin Mocha theme colors — https://catppuccin.com/palette
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
